<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy v1 | Professional Deployment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 font-sans">

    <div class="w-full h-72 bg-cover bg-center shadow-md" style="background-image: url('https://files.catbox.moe/ur3mnp.jpeg');">
        <div class="w-full h-full bg-black/30"></div>
    </div>

    <div class="max-w-2xl mx-auto -mt-24 px-4">
        <div class="glass rounded-3xl shadow-2xl p-8 border border-slate-100">
            <h1 class="text-4xl font-extrabold text-slate-800 mb-2">Deploy v1</h1>
            <p class="text-slate-500 mb-8">Platform deployment cepat dan profesional.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Websed</label>
                    <input type="text" id="webName" placeholder="Contoh: vikk-deploy" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none transition">
                </div>

                <button onclick="document.getElementById('fileInput').click()" class="w-full py-4 bg-white border-2 border-slate-200 hover:border-blue-500 hover:text-blue-600 text-slate-600 rounded-xl transition duration-300 font-semibold flex items-center justify-center">
                    <i class="fas fa-folder-open mr-2"></i> Ambil File HTML
                </button>
                <input type="file" id="fileInput" class="hidden" accept=".html">
                
                <button id="deployBtn" onclick="handleDeploy()" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl transition duration-300 font-bold shadow-lg shadow-slate-300">
                    <i class="fas fa-rocket mr-2"></i> Deploy Sekarang
                </button>
            </div>
        </div>

        <div class="mt-10 mb-10">
            <h2 class="text-lg font-bold text-slate-700 mb-4 px-2">Deployment Statistics</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total</p>
                    <h3 class="text-2xl font-black text-slate-800" id="totalDeploy">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Success</p>
                    <h3 class="text-2xl font-black text-emerald-600" id="successDeploy">0</h3>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
                    <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Failed</p>
                    <h3 class="text-2xl font-black text-rose-600" id="failedDeploy">0</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function handleDeploy() {
            const webName = document.getElementById('webName').value;
            if (!webName) {
                Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Masukkan Nama Websed terlebih dahulu!' });
                return;
            }

            const btn = document.getElementById('deployBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Deploying...';

            try {
                const response = await fetch('/api/deploy', { 
                    method: 'POST',
                    body: JSON.stringify({ name: webName }) 
                });
                const result = await response.json();
                
                Swal.fire({
                    title: 'Deployment Berhasil!',
                    html: `Website <b>${webName}</b> telah aktif.<br><br><a href="${result.url}" target="_blank" class="text-blue-600 underline font-bold">${result.url}</a>`,
                    icon: 'success',
                    confirmButtonText: 'Buka Website',
                    confirmButtonColor: '#0f172a'
                }).then(() => {
                    window.open(result.url, '_blank');
                });
                
                document.getElementById('totalDeploy').innerText = parseInt(document.getElementById('totalDeploy').innerText) + 1;
                document.getElementById('successDeploy').innerText = parseInt(document.getElementById('successDeploy').innerText) + 1;
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'Gagal', text: 'Terjadi kesalahan saat deployment.' });
                document.getElementById('failedDeploy').innerText = parseInt(document.getElementById('failedDeploy').innerText) + 1;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-rocket mr-2"></i> Deploy Sekarang';
            }
        }
    </script>
</body>
</html>
